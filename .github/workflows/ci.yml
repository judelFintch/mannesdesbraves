name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.4' ]
        node: [ '20' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, fileinfo
          ini-values: post_max_size=256M, memory_limit=512M

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: laravel/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/laravel/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        working-directory: ./laravel
        run: composer install --no-progress --no-suggest --prefer-dist --no-interaction

      - name: Prepare environment for tests
        working-directory: ./laravel
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          mkdir -p database
          touch database/database.sqlite
          php -r "file_put_contents('.env', preg_replace('/^DB_CONNECTION=.*$/m', 'DB_CONNECTION=sqlite', file_get_contents('.env')));
          file_put_contents('.env', preg_replace('/^DB_DATABASE=.*$/m', 'DB_DATABASE=' . getcwd() . '/database/database.sqlite', file_get_contents('.env')));

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            laravel/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/laravel/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install Node dependencies
        working-directory: ./laravel
        run: npm ci

      - name: Build Tailwind CSS
        working-directory: ./laravel
        run: npm run build:css

      - name: Run migrations
        working-directory: ./laravel
        run: php artisan migrate --force

      - name: Run tests
        working-directory: ./laravel
        run: php artisan test --no-coverage --parallel
